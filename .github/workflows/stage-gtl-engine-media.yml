name: Stage GTL Engine media

on:
  push:
    branches:
      - media/gtl-engine-demo

permissions:
  contents: write

jobs:
  stage-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/gtl-engine-demo

      - name: Download portfolio media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images assets/videos
          curl --fail --location --retry 3 \
            "https://at.adobe.com/IwnUHBBamxLaTg7s" \
            --output assets/images/gtl-engine-thumbnail.png
          curl --fail --location --retry 3 \
            "https://at.adobe.com/GuvPeCl9QEgtAilD" \
            --output assets/videos/gtl-engine-demo.mp4
          test "$(stat -c%s assets/images/gtl-engine-thumbnail.png)" -gt 100000
          test "$(stat -c%s assets/videos/gtl-engine-demo.mp4)" -gt 1000000
          file assets/images/gtl-engine-thumbnail.png | grep -q "PNG image data"
          file assets/videos/gtl-engine-demo.mp4 | grep -q "ISO Media"

      - name: Commit media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/gtl-engine-thumbnail.png assets/videos/gtl-engine-demo.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "media: add GTL Engine thumbnail and demo video"
          git push origin HEAD:media/gtl-engine-demo
