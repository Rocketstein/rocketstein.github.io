name: Apply minimal home hero

on:
  push:
    branches:
      - design/simplify-home-hero

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/simplify-home-hero

      - name: Write simplified Home page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl --fail --location --retry 3 \
            "https://at.adobe.com/gC4crGiA7GUadrhl" \
            --output assets/images/home-cubes.png
          test "$(stat -c%s assets/images/home-cubes.png)" -gt 10000
          file assets/images/home-cubes.png | grep -q "PNG image data"

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="Portfolio of Hyungjun (Kenneth) Kim, a C++ game and rendering programmer focused on custom engines, real-time graphics, and gameplay systems.">
            <meta name="theme-color" content="#080c10">
            <meta property="og:title" content="Hyungjun Kim — C++ Game & Rendering Programmer">
            <meta property="og:description" content="Custom engines, real-time rendering, editor tooling, and gameplay systems.">
            <meta property="og:type" content="website">
            <meta property="og:url" content="https://rocketstein.github.io/">
            <title>Hyungjun Kim — C++ Game & Rendering Programmer</title>
            <link rel="icon" href="favicon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="styles.css">
            <link rel="stylesheet" href="home.css">
            <script src="script.js" defer></script>
          </head>
          <body class="page-home">
            <a class="skip-link" href="#main">Skip to content</a>
            <header class="site-header">
              <div class="header-inner">
                <a class="brand" href="index.html" aria-label="Hyungjun Kim, home">
                  <span class="brand-mark" aria-hidden="true">HK</span>
                  <span>Hyungjun Kim</span>
                </a>
                <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
                  <span class="sr-only">Toggle navigation</span><span></span><span></span>
                </button>
                <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
                  <a href="index.html" aria-current="page">Home</a>
                  <a href="about.html">About</a>
                  <a href="works.html">Works</a>
                  <a href="contact.html">Contact</a>
                  <a class="nav-external" href="https://github.com/Rocketstein" target="_blank" rel="noreferrer">GitHub ↗</a>
                </nav>
              </div>
            </header>

            <main id="main" class="home-main">
              <section class="home-hero" aria-labelledby="hero-title">
                <div class="hero-copy">
                  <p class="eyebrow">Hyungjun “Kenneth” Kim</p>
                  <h1 id="hero-title">C++ Game &amp;<br>Rendering Programmer</h1>
                  <p class="hero-intro">
                    Mathematics and Computer Science graduate from the University of Illinois Urbana-Champaign, focused on custom game engines, real-time rendering, and gameplay systems.
                  </p>
                  <div class="hero-actions">
                    <a class="button button-primary" href="works.html">View selected works</a>
                    <a class="button button-secondary" href="about.html">About me</a>
                  </div>
                </div>

                <figure class="hero-image">
                  <img src="assets/images/home-cubes.png" alt="A procedural scene of glowing cubic buildings suspended in space." width="1216" height="800" loading="eager" fetchpriority="high">
                </figure>
              </section>
            </main>

            <footer class="site-footer">
              <p>© <span data-year></span> Hyungjun Kim</p>
              <nav aria-label="Footer navigation"><a href="about.html">About</a><a href="works.html">Works</a><a href="contact.html">Contact</a></nav>
            </footer>
          </body>
          </html>
          HTML

          cat > home.css <<'CSS'
          /* Home-only layout: intentionally concise and independent from the other pages. */
          .page-home::before {
            position: fixed;
            z-index: -2;
            inset: 0;
            background-image:
              linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
            background-size: 72px 72px;
            mask-image: linear-gradient(to bottom, #000, transparent 78%);
            pointer-events: none;
            content: "";
          }

          .home-main {
            min-height: calc(100svh - var(--header-height) - 74px);
            display: grid;
            align-items: stretch;
          }

          .home-hero {
            width: min(1320px, calc(100% - 48px));
            min-height: calc(100svh - var(--header-height) - 74px);
            display: grid;
            grid-template-columns: minmax(340px, .78fr) minmax(500px, 1.22fr);
            align-items: center;
            gap: clamp(28px, 4vw, 64px);
            margin: 0 auto;
            padding: 44px 0;
          }

          .page-home .hero-copy {
            position: relative;
            z-index: 3;
            max-width: 550px;
          }

          .page-home .hero-copy h1 {
            margin: 0;
            font-size: clamp(3.15rem, 5.8vw, 5.65rem);
            font-weight: 760;
            letter-spacing: -.063em;
            line-height: .96;
          }

          .page-home .hero-intro {
            max-width: 535px;
            margin: 26px 0 0;
            color: var(--muted);
            font-size: clamp(1rem, 1.25vw, 1.16rem);
            line-height: 1.72;
          }

          .page-home .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
          }

          .hero-image {
            position: relative;
            align-self: stretch;
            min-height: 500px;
            margin: 0;
            overflow: hidden;
            isolation: isolate;
          }

          .hero-image::before {
            position: absolute;
            z-index: 2;
            inset: 0;
            background:
              linear-gradient(90deg, var(--bg) 0%, rgba(8,12,16,.96) 3%, rgba(8,12,16,.56) 16%, transparent 43%),
              linear-gradient(180deg, var(--bg) 0%, transparent 14%, transparent 76%, var(--bg) 100%);
            pointer-events: none;
            content: "";
          }

          .hero-image::after {
            position: absolute;
            z-index: 2;
            inset: 0;
            background: radial-gradient(ellipse 70% 66% at 62% 48%, transparent 52%, rgba(8,12,16,.18) 72%, var(--bg) 100%);
            pointer-events: none;
            content: "";
          }

          .hero-image img {
            position: absolute;
            inset: -3% -5% -3% -8%;
            width: 113%;
            height: 106%;
            object-fit: cover;
            object-position: center;
            opacity: .88;
            filter: saturate(.84) brightness(.77) contrast(1.03);
            -webkit-mask-image: radial-gradient(ellipse 83% 79% at 60% 48%, #000 50%, rgba(0,0,0,.9) 67%, transparent 100%);
            mask-image: radial-gradient(ellipse 83% 79% at 60% 48%, #000 50%, rgba(0,0,0,.9) 67%, transparent 100%);
          }

          @media (max-width: 980px) {
            .home-main,
            .home-hero { min-height: auto; }

            .home-hero {
              grid-template-columns: 1fr;
              padding: 64px 0 24px;
              gap: 28px;
            }

            .page-home .hero-copy { max-width: 690px; }

            .hero-image {
              min-height: clamp(330px, 58vw, 520px);
              margin: 0 -16px;
            }

            .hero-image::before {
              background:
                linear-gradient(180deg, var(--bg) 0%, rgba(8,12,16,.35) 15%, transparent 35%, transparent 70%, var(--bg) 100%),
                linear-gradient(90deg, var(--bg) 0%, transparent 14%, transparent 86%, var(--bg) 100%);
            }

            .hero-image img {
              inset: 0;
              width: 100%;
              height: 100%;
              -webkit-mask-image: radial-gradient(ellipse 88% 79% at 50% 48%, #000 52%, rgba(0,0,0,.9) 70%, transparent 100%);
              mask-image: radial-gradient(ellipse 88% 79% at 50% 48%, #000 52%, rgba(0,0,0,.9) 70%, transparent 100%);
            }
          }

          @media (max-width: 720px) {
            .home-hero {
              width: min(100% - 32px, 1320px);
              padding: 50px 0 16px;
            }

            .page-home .hero-copy h1 {
              font-size: clamp(2.65rem, 13vw, 4.2rem);
            }

            .page-home .hero-intro {
              margin-top: 22px;
              font-size: 1rem;
            }

            .page-home .hero-actions { margin-top: 26px; }

            .hero-image {
              min-height: clamp(250px, 65vw, 360px);
              margin: 2px -10px 0;
            }

            .hero-image img {
              filter: saturate(.82) brightness(.73) contrast(1.04);
            }
          }

          @media (max-width: 480px) {
            .page-home .hero-actions .button { flex: 1 1 100%; }
          }
          CSS

      - name: Commit Home update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home.css assets/images/home-cubes.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: simplify Home hero and add faded project image"
          git push origin HEAD:design/simplify-home-hero
