name: Bootstrap initial portfolio site

on:
  push:
    branches:
      - automation/bootstrap-portfolio

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write portfolio files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import pathlib
          import tarfile

          payload = ''''''
          archive = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              bundle.extractall('.')

          workflow = pathlib.Path('.github/workflows/bootstrap-portfolio.yml')
          workflow.unlink()
          PY

      - name: Commit generated site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add initial game-programming portfolio site"
          git push
