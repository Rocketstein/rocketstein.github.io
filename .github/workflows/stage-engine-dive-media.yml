name: Stage Engine Dive media

on:
  push:
    branches:
      - media/engine-dive-demo

permissions:
  contents: write

jobs:
  stage-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/engine-dive-demo

      - name: Download Engine Dive video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/videos
          curl --fail --location --retry 3 \
            "https://at.adobe.com/EdogHXkQILEybspx" \
            --output assets/videos/engine-dive-demo.mp4
          test "$(stat -c%s assets/videos/engine-dive-demo.mp4)" -gt 1000000
          file assets/videos/engine-dive-demo.mp4 | grep -q "ISO Media"

      - name: Commit media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/engine-dive-demo.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "media: add Engine Dive gameplay demo"
          git push origin HEAD:media/engine-dive-demo
